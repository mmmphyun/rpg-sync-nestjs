services:
  postgres:
    image: postgres:16-alpine
    container_name: rpg-sync-pg
    environment:
      POSTGRES_DB: rpg_sync
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg_user -d rpg_sync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rpg-sync-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
